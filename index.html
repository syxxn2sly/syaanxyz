  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

; height:260px; background-image:url('{{ img }}'); background-size:contain; background-repeat:no-repeat; background-position:center; background-color:#fff; border-radius:18px; border:1px solid var(--stroke);\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ sheet.noImages }}\" hint-placeholder-val=\"{{ false }}\">\n          <x-import component-from-global-scope=\"image-slot\" from=\"c5818ad1-9120-4b42-b577-160d4ec4c78b#/image-slot.js\" id=\"{{ sheet.imgId }}\" shape=\"rounded\" radius=\"18\" placeholder=\"Drop a project photo\" style=\"width:100%; height:300px; margin-top:22px;\" hint-size=\"100%,300px\"><\u002Fx-import>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ sheet.sections }}\" as=\"sec\" hint-placeholder-count=\"3\">\n          <div style=\"margin-top:22px;\">\n            <div style=\"font-size:12px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:6px;\">{{ sec.heading }}<\u002Fdiv>\n            <div style=\"font-size:15px; line-height:1.65; color:var(--text2); text-wrap:pretty;\">{{ sec.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-top:24px;\">\n          <sc-for list=\"{{ sheet.tags }}\" as=\"tag\" hint-placeholder-count=\"4\">\n            <span style=\"background:var(--chip); font-size:13px; font-weight:600; padding:5px 12px; border-radius:999px; color:var(--text2);\">{{ tag }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#3D6DB0&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#3D6DB0&quot;, &quot;#46689A&quot;, &quot;#556070&quot;, &quot;#22344F&quot;], &quot;section&quot;: &quot;Theme&quot;},\n  &quot;headingFont&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Space Grotesk&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;Instrument Sans&quot;, &quot;Space Grotesk&quot;, &quot;Sora&quot;, &quot;System (SF Pro)&quot;], &quot;section&quot;: &quot;Theme&quot;},\n  &quot;bodyFont&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Schibsted Grotesk&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;Schibsted Grotesk&quot;, &quot;Bricolage Grotesque&quot;, &quot;Instrument Sans&quot;, &quot;System (SF Pro)&quot;], &quot;section&quot;: &quot;Theme&quot;},\n  &quot;showFirstYear&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;},\n  &quot;formspreeId&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://formspree.io/f/xaqrqdbg&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Ask me anything&quot;}\n}\">\nclass Component extends DCLogic {\n  state = { dark: false, now: new Date(), sheet: null, locked: false, unlocking: false, jiggling: false, dockOrder: null, dragIdx: null, blockOrder: null, blockDragIdx: null, zone: 'EST', moreOpen: false, amaEmail: '', amaText: '', amaState: 'idle', chatOpen: false, chatInput: '', chatBusy: false,\n    chatMsgs: [{ role: 'assistant', text: \"Hey! I'm Syaan's portfolio assistant. Ask me anything about his experience, projects, or skills.\" }] };\n\n  blockDefault = ['hero', 'edu', 'projects', 'exp', 'stack', 'ama'];\n\n  bodyFonts = {\n    'Schibsted Grotesk': \"'Schibsted Grotesk', -apple-system, sans-serif\",\n    'Bricolage Grotesque': \"'Bricolage Grotesque', -apple-system, sans-serif\",\n    'Instrument Sans': \"'Instrument Sans', -apple-system, sans-serif\",\n    'System (SF Pro)': \"-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif\"\n  };\n\n  headingFonts = {\n    'Instrument Sans': \"'Instrument Sans', -apple-system, sans-serif\",\n    'Space Grotesk': \"'Space Grotesk', -apple-system, sans-serif\",\n    'Sora': \"'Sora', -apple-system, sans-serif\",\n    'System (SF Pro)': \"-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif\"\n  };\n\n  dockDefs = {\n    email:    { label: 'Email',    href: 'mailto:syaanmerchant09@icloud.com',                        glyph: '@',  bg: 'linear-gradient(160deg,#5AC8FA,#0A84FF)' },\n    mcmaster: { label: 'McMaster', href: 'mailto:merchs8@mcmaster.ca',                               glyph: 'M',  bg: 'linear-gradient(160deg,#8E1F2F,#5E1420)' },\n    linkedin: { label: 'LinkedIn', href: 'https://www.linkedin.com/in/syaan-merchant-127a88285/',    glyph: 'in', bg: 'linear-gradient(160deg,#2E77B5,#1B4F7E)' },\n    github:   { label: 'GitHub',   href: 'https://github.com/syaanmerchant',                         glyph: 'gh', bg: 'linear-gradient(160deg,#3a3a42,#17171c)' },\n    resume:   { label: 'Resume',   href: 'resume.pdf',              glyph: 'CV', bg: 'linear-gradient(160deg,#FF9F0A,#E0740A)' },\n    ask:      { label: 'Ask Me',   href: '#contact',                                                 glyph: '…',  bg: 'linear-gradient(160deg,#34C759,#1E9E38)' }\n  };\n  dockDefault = ['email', 'mcmaster', 'linkedin', 'github', 'resume', 'ask'];\n\n  aboutSyaan = `You are the friendly AI assistant on Syaan Merchant's portfolio website, answering questions from recruiters and visitors. Facts you know:\n- Syaan Merchant: second-year Software Engineering (B.Eng, Co-op) student at McMaster University, 2024-2029 expected. GPA 3.98, Award of Excellence (Faculty of Engineering), Dean's Honour List (x2). Open to co-op/internship opportunities.\n- Experience: Software Developer at Bell Canada (May-Aug 2025) — built a full-stack internal platform integrating Jira/Confluence into an IDE-style web tool (Vue 3, AG Grid Enterprise, ASP.NET Core .NET 8, EF Core, PostgreSQL 15); led the dark mode/theming system adopted by 400+ employees; spearheaded French localization; streamlined GitLab CI/CD cutting shipped defects by 25%. Code Instructor (Sensei) at Code Ninjas (Feb 2023-Aug 2024) — taught JavaScript levels 1-10, reviewed 100+ assignments. Accounting Intern at Berlin Packaging Toronto (Jul 2022-Aug 2024) — accounts receivable, 50+ monthly bilingual collection calls.\n- Projects: CLAIRITY (DeltaHacks 12 hackathon) — privacy-first iOS app (Swift/SwiftUI, Gemini API, OCR/NLP) converting dense medical/insurance language into plain-English action steps; on Devpost. Wastewater Filter System (ENG 1P13) — microplastic filtration concept, ANSYS Granta EduPack material selection + EcoAudit lifecycle analysis. Navioto Vision Assistant (McMaster IMPACT initiative, May 2025) — vest-mounted AI wearable co-designed with a client with Usher's Syndrome; Seeing AI + low-latency Bluetooth, 90%+ recognition accuracy. Airport Luggage System (Jan 2025) — drawbridge/spool baggage system with rotary actuator, QArm + Python, +30% efficiency. Mini Autonomous Car (Jul 2024) — Arduino C obstacle avoidance with gesture control.\n- Skills: C#, Python, TypeScript, JavaScript, Java, Swift, Arduino C, ASP.NET Core (.NET 8), EF Core, PostgreSQL, REST APIs, Vue 3, Tailwind CSS, AG Grid Enterprise, MATLAB, Autodesk Inventor, QArm, GitLab CI/CD, Agile/Scrum, UX localization, bilingual English/French.\n- Interests: basketball, badminton, robotics, LLMs/AI. Volunteered with FIFA World Cup Toronto 2026 as Fan Operations.\n- Contact: syaanmerchant09@icloud.com, merchs8@mcmaster.ca, linkedin.com/in/syaan-merchant-127a88285, github.com/syaanmerchant.\nRules: be concise (2-4 sentences), warm, and honest. Speak about Syaan in third person. If asked something you don't know about him, say so and suggest emailing him. Politely redirect off-topic questions back to Syaan's work. Never invent facts.`;\n\n  // add new entries here — they appear under \"More projects\"\n  moreProjects = [\n    { title: 'Airport Luggage System', context: 'McMaster University · Jan 2025', href: 'https://syaanmerchant786.wixsite.com/syaan-merchant/project-one-p1',\n      blurb: 'Drawbridge-and-spool baggage handling system with a rotary actuator, improving handling efficiency by 30% — QArm and Python software for baggage sorting, flight weight prediction, and check-in optimization.',\n      tags: ['Python', 'QArm', 'Rotary Actuator'] },\n    { title: 'Mini Autonomous Car', context: 'Personal · Jul 2024',\n      blurb: '360° autonomous miniature car with 5 cm obstacle detection and self-redirection — real-time avoidance algorithm in Arduino C with a gesture-controlled Arduino Uno navigation system.',\n      tags: ['Arduino C', 'Arduino Uno', 'Robotics'] }\n  ];\n\n  writeups = {\n    filter: {\n      imgId: 'writeup-filter',\n      images: ['uploads/pasted-1784252464598-0.png', 'uploads/Screenshot_16-7-2026_214031_syaanmerchant786.wixsite.com.jpeg'],\n      title: 'Wastewater Filter System',\n      subtitle: 'ENG 1P13 · Design Studio',\n      tags: ['ANSYS Granta EduPack', 'EcoAudit', 'Material Selection', 'CAD'],\n      sections: [\n        { heading: 'The problem', body: 'Municipal wastewater plants let microplastics pass through conventional treatment stages and back into waterways. Our team was tasked with designing a filtration stage that could capture microplastic particles without disrupting existing plant flow rates.' },\n        { heading: 'What we built', body: 'A multi-stage mesh filtration concept sized for a municipal intake, with materials chosen through ANSYS Granta EduPack screening for corrosion resistance, cost, and durability under continuous flow.' },\n        { heading: 'My contribution', body: 'I led the material selection and lifecycle analysis — running EcoAudit comparisons across candidate materials to balance environmental footprint against mechanical performance, and presenting the trade-off study in the final design review.' }\n      ]\n    },\n    navioto: {\n      imgId: 'writeup-navioto',\n      images: ['uploads/Screenshot_15-7-2026_221021_syaanmerchant786.wixsite.com.jpeg'],\n      title: 'Navioto Vision Assistant',\n      subtitle: 'ENG 1P13 · Design Studio',\n      tags: ['Assistive Tech', 'Wearables', 'Client Co-design', 'Ergonomics'],\n      sections: [\n        { heading: 'The problem', body: 'Our client lives with Usher\\u2019s Syndrome, which affects both vision and hearing. Off-the-shelf navigation aids relied on audio cues that didn\\u2019t work for them, and handheld devices tied up hands needed for a cane.' },\n        { heading: 'What we built', body: 'A hands-free, vest-mounted navigation assistant built through McMaster\\u2019s IMPACT human-centered design initiative. Integrates Seeing AI with a low-latency Bluetooth interface for real-time object and text recognition at \\u226590% accuracy, with a custom mount and strap system holding tilt within 3\\u00b0 under movement.' },\n        { heading: 'My contribution', body: 'I worked directly with the client through co-design sessions, translating their feedback into tactile control placement and mounting decisions, and prototyped the ergonomic load-distribution layout.' }\n      ]\n    }\n  };\n\n  componentDidMount() {\n    let dark = false;\n    try {\n      const saved = localStorage.getItem('syaan-theme');\n      if (saved) dark = saved === 'dark';\n      else dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;\n    } catch (e) {}\n    this.applyTheme(dark);\n    this.setState({ dark });\n    this.applyAccent();\n    this._timer = setInterval(() => this.setState({ now: new Date() }), 30000);\n\n    try {\n      const savedBlocks = JSON.parse(localStorage.getItem('syaan-widgets') || 'null');\n      if (Array.isArray(savedBlocks) && savedBlocks.length === this.blockDefault.length && this.blockDefault.every(id => savedBlocks.includes(id))) {\n        this.setState({ blockOrder: savedBlocks });\n      }\n    } catch (e) {}\n    try {\n      const saved = JSON.parse(localStorage.getItem('syaan-dock') || 'null');\n      if (Array.isArray(saved) && saved.length === this.dockDefault.length && saved.every(id => this.dockDefs[id])) {\n        this.setState({ dockOrder: saved });\n      }\n    } catch (e) {}\n\n    // lock screen: once per session\n    try {\n      if (!sessionStorage.getItem('syaan-unlocked')) this.setState({ locked: true });\n    } catch (e) { this.setState({ locked: true }); }\n\n    this._onKey = (e) => {\n      if (this.state.locked && !this.state.unlocking) { this.doUnlock(); }\n      else if (e.key === 'Escape' && this.state.jiggling) { this.setJiggle(false); }\n    };\n    window.addEventListener('keydown', this._onKey);\n  }\n\n  doUnlock() {\n    this.setState({ unlocking: true });\n    try { sessionStorage.setItem('syaan-unlocked', '1'); } catch (e) {}\n    setTimeout(() => this.setState({ locked: false, unlocking: false }), 700);\n  }\n\n  sendAma() {\n    const q = this.state.amaText.trim();\n    const email = this.state.amaEmail.trim();\n    if (!q || this.state.amaState === 'sending') return;\n    const id = this.props.formspreeId;\n    if (!id) {\n      window.location.href = 'mailto:syaanmerchant09@icloud.com?subject=' + encodeURIComponent('Question from your portfolio') + '&body=' + encodeURIComponent(q + (email ? '\\n\\nFrom: ' + email : ''));\n      return;\n    }\n    this.setState({ amaState: 'sending' });\n    const fd = new FormData();\n    if (email) fd.append('email', email);\n    fd.append('message', q);\n    fetch(String(id).startsWith('http') ? id : 'https://formspree.io/f/' + id, {\n      method: 'POST',\n      headers: { 'Accept': 'application/json' },\n      body: fd\n    }).then(r => {\n      if (r.ok) this.setState({ amaState: 'sent', amaText: '', amaEmail: '' });\n      else return r.json().then(j => { console.warn('Formspree error:', j); this.setState({ amaState: 'error' }); });\n    }).catch((e) => { console.warn('Formspree fetch failed:', e); this.setState({ amaState: 'error' }); });\n  }\n\n  async sendChat() {\n    const q = this.state.chatInput.trim();\n    if (!q || this.state.chatBusy) return;\n    const msgs = this.state.chatMsgs.concat([{ role: 'user', text: q }]);\n    this.setState({ chatMsgs: msgs, chatInput: '', chatBusy: true }, () => this.scrollChat());\n    let reply;\n    try {\n      if (!window.claude || !window.claude.complete) throw new Error('no claude');\n      reply = await window.claude.complete({\n        system: this.aboutSyaan,\n        messages: msgs.map(m => ({ role: m.role, content: m.text }))\n      });\n    } catch (e) {\n      reply = \"I couldn't reach the AI right now — try again in a moment, or email Syaan directly at syaanmerchant09@icloud.com.\";\n    }\n    this.setState({ chatMsgs: this.state.chatMsgs.concat([{ role: 'assistant', text: reply }]), chatBusy: false }, () => this.scrollChat());\n  }\n\n  scrollChat() {\n    if (this._chatEl) this._chatEl.scrollTop = this._chatEl.scrollHeight;\n  }\n\n  setJiggle(on) {\n    document.documentElement.classList.toggle('jiggle', on);\n    this.setState({ jiggling: on });\n  }\n\n  componentDidUpdate() { this.applyAccent(); }\n  componentWillUnmount() {\n    clearInterval(this._timer);\n    clearTimeout(this._pressTimer);\n    window.removeEventListener('keydown', this._onKey);\n  }\n\n  applyTheme(dark) {\n    document.documentElement.classList.toggle('dark', dark);\n  }\n\n  applyAccent() {\n    const a = this.props.accent;\n    if (a) document.documentElement.style.setProperty('--accent', a);\n    const f = this.headingFonts[this.props.headingFont ?? 'Instrument Sans'];\n    if (f) document.documentElement.style.setProperty('--hfont', f);\n    const b = this.bodyFonts[this.props.bodyFont ?? 'Schibsted Grotesk'];\n    if (b) document.documentElement.style.setProperty('--bfont', b);\n  }\n\n  renderVals() {\n    const dark = this.state.dark;\n    const tz = this.state.zone === 'PST' ? 'America/Los_Angeles' : 'America/Toronto';\n    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(this.state.now);\n    const get = (t) => (parts.find(p => p.type === t) || {}).value || '';\n    const clock = get('hour') + ':' + get('minute') + ' ' + get('dayPeriod');\n    const h = parseInt(get('hour'), 10) % 12 + (get('dayPeriod') === 'PM' ? 12 : 0);\n    const m = parseInt(get('minute'), 10);\n\n    const jobs = [\n      { initial: 'B', iconBg: 'linear-gradient(160deg,#0A84FF,#0055C9)', title: 'Software Developer Intern', org: 'Bell Canada', dates: 'May – Aug 2025',\n        blurb: 'Built a full-stack internal platform integrating Jira and Confluence into an IDE-style web tool (Vue 3 + ASP.NET Core / .NET 8, PostgreSQL). Led the dark mode and theming system adopted by 400+ employees, spearheaded French localization, and streamlined GitLab CI/CD \\u2014 cutting shipped defects by 25%.', sep: 'var(--sep)' },\n      { initial: 'CN', iconBg: 'linear-gradient(160deg,#32D74B,#1E9E38)', title: 'Code Instructor (Sensei)', org: 'Code Ninjas', dates: 'Feb 2023 – Aug 2024',\n        blurb: 'Taught JavaScript fundamentals through advanced concepts (Levels 1–10); reviewed and graded 100+ assignments with debugging support that cut recurring errors.', sep: 'var(--sep)' },\n      { initial: 'BP', iconBg: 'linear-gradient(160deg,#FF9F0A,#D97706)', title: 'Accounting Intern', org: 'Berlin Packaging Toronto', dates: 'Jul 2022 – Aug 2024',\n        blurb: 'Managed accounts receivable via 50+ monthly bilingual collection calls; resolved most billing inquiries on first contact.', sep: 'transparent' }\n    ];\n\n    return {\n      clock,\n      zoneLabel: this.state.zone,\n      toggleZone: () => this.setState({ zone: this.state.zone === 'EST' ? 'PST' : 'EST' }),\n      jobs,\n      sheetOpen: !!this.state.sheet,\n      sheet: (() => {\n        const s = this.state.sheet ? this.writeups[this.state.sheet] : { sections: [], tags: [] };\n        return Object.assign({ hasImages: !!(s.images && s.images.length), noImages: !!this.state.sheet && !(s.images && s.images.length) }, s);\n      })(),\n      openFilter: (e) => { e.preventDefault(); this.setState({ sheet: 'filter' }); },\n      openNavioto: (e) => { e.preventDefault(); this.setState({ sheet: 'navioto' }); },\n      closeSheet: () => this.setState({ sheet: null }),\n      stopProp: (e) => e.stopPropagation(),\n      locked: this.state.locked,\n      lockY: this.state.unlocking ? '-100%' : '0',\n      lockClock: ((h % 12) || 12) + ':' + String(m).padStart(2, '0'),\n      lockDate: this.state.now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),\n      unlock: () => { if (!this.state.unlocking) this.doUnlock(); },\n      jiggling: this.state.jiggling,\n      stopJiggle: () => this.setJiggle(false),\n      pressStart: (e) => {\n        if (e.target.closest('a, button')) return;\n        clearTimeout(this._pressTimer);\n        this._pressTimer = setTimeout(() => this.setJiggle(!this.state.jiggling), 600);\n      },\n      pressEnd: () => clearTimeout(this._pressTimer),\n      dockApps: (this.state.dockOrder || this.dockDefault).filter(id => id !== 'ask' || (window.claude && window.claude.complete)).map((id, i) => {\n        const d = this.dockDefs[id];\n        return Object.assign({}, d, {\n          click: id === 'ask' ? (e) => { e.preventDefault(); this.setState({ chatOpen: !this.state.chatOpen }); } : undefined,\n          opacity: this.state.dragIdx === i ? '0.35' : '1',\n          dragStart: (e) => {\n            e.dataTransfer.effectAllowed = 'move';\n            this.setState({ dragIdx: i });\n          },\n          dragOver: (e) => {\n            e.preventDefault();\n            const from = this.state.dragIdx;\n            if (from === null || from === i) return;\n            const order = (this.state.dockOrder || this.dockDefault).slice();\n            const [moved] = order.splice(from, 1);\n            order.splice(i, 0, moved);\n            this.setState({ dockOrder: order, dragIdx: i });\n          }\n        });\n      }),\n      dragEnabled: this.state.jiggling,\n      dragCursor: this.state.jiggling ? 'grab' : 'auto',\n      blocks: (() => {\n        const order = this.state.blockOrder || this.blockDefault;\n        const out = {};\n        order.forEach((id, i) => {\n          out[id] = {\n            order: i,\n            dragStart: (e) => {\n              if (!this.state.jiggling) { e.preventDefault(); return; }\n              e.dataTransfer.effectAllowed = 'move';\n              e.stopPropagation();\n              this.setState({ blockDragIdx: i });\n            },\n            dragOver: (e) => {\n              e.preventDefault();\n              const from = this.state.blockDragIdx;\n              if (from === null || from === i) return;\n              const next = (this.state.blockOrder || this.blockDefault).slice();\n              const [moved] = next.splice(from, 1);\n              next.splice(i, 0, moved);\n              this.setState({ blockOrder: next, blockDragIdx: i });\n            }\n          };\n        });\n        return out;\n      })(),\n      blockDrop: (e) => {\n        e.preventDefault();\n        if (this.state.blockDragIdx !== null) {\n          try { localStorage.setItem('syaan-widgets', JSON.stringify(this.state.blockOrder || this.blockDefault)); } catch (err) {}\n          this.setState({ blockDragIdx: null });\n        }\n      },\n      amaEmail: this.state.amaEmail,\n      amaText: this.state.amaText,\n      amaTypeEmail: (e) => this.setState({ amaEmail: e.target.value, amaState: 'idle' }),\n      amaType: (e) => this.setState({ amaText: e.target.value, amaState: 'idle' }),\n      amaKey: (e) => { if (e.key === 'Enter') this.sendAma(); },\n      amaSend: () => this.sendAma(),\n      amaButton: this.state.amaState === 'sending' ? 'Sending…' : 'Send',\n      amaHasStatus: this.state.amaState === 'sent' || this.state.amaState === 'error',\n      amaStatus: this.state.amaState === 'sent' ? 'Sent! Thanks — I\\u2019ll get back to you soon.' : 'Something went wrong — try again or email me directly.',\n      amaStatusColor: this.state.amaState === 'sent' ? '#30D158' : '#FF453A',\n      chatOpen: this.state.chatOpen,\n      chatClose: () => this.setState({ chatOpen: false }),\n      chatInput: this.state.chatInput,\n      chatBusy: this.state.chatBusy,\n      chatType: (e) => this.setState({ chatInput: e.target.value }),\n      chatKey: (e) => { if (e.key === 'Enter') this.sendChat(); },\n      chatSend: () => this.sendChat(),\n      chatListRef: (el) => { this._chatEl = el; },\n      chatMsgs: this.state.chatMsgs.map(m => ({\n        text: m.text,\n        justify: m.role === 'user' ? 'flex-end' : 'flex-start',\n        bg: m.role === 'user' ? 'var(--accent)' : 'var(--chip)',\n        color: m.role === 'user' ? '#fff' : 'var(--text)'\n      })),\n      dockDrop: (e) => {\n        e.preventDefault();\n        if (this.state.dragIdx !== null) {\n          try { localStorage.setItem('syaan-dock', JSON.stringify(this.state.dockOrder || this.dockDefault)); } catch (err) {}\n          this.setState({ dragIdx: null });\n        }\n      },\n      showFirstYear: this.props.showFirstYear ?? true,\n      moreOpen: this.state.moreOpen,\n      moreCount: this.moreProjects.length + (this.moreProjects.length === 1 ? ' project' : ' projects'),\n      moreChevron: this.state.moreOpen ? '180deg' : '0deg',\n      moreProjects: this.moreProjects.map(p => Object.assign({ noHref: !p.href }, p)),\n      toggleMore: () => this.setState({ moreOpen: !this.state.moreOpen }),\n      switchBg: dark ? 'var(--accent)' : 'rgba(120,120,128,0.32)',\n      knobLeft: dark ? '22px' : '2px',\n      toggleTheme: () => {\n        const next = !this.state.dark;\n        this.applyTheme(next);\n        try { localStorage.setItem('syaan-theme', next ? 'dark' : 'light'); } catch (e) {}\n        this.setState({ dark: next });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
